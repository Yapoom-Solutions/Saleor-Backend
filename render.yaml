services:
  # 1. Redis Cache Service
  - type: redis
    name: saleor-redis
    plan: free
    ipAllowList: [] # restrict to internal access only

  # 2. Saleor Core API (Django ASGI)
  - type: web
    name: saleor-api
    env: docker
    dockerContext: ./saleor
    dockerfilePath: ./saleor/Dockerfile
    plan: starter
    envVars:
      - fromGroup: saleor-shared-secrets
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: saleor-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: saleor-redis
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: redis
          name: saleor-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,api,.onrender.com,.udayamarketing.in
      - key: DEFAULT_FROM_EMAIL
        value: noreply@example.com
      - key: HTTP_IP_FILTER_ENABLED
        value: "False"

  # 3. Celery Worker (Background Processes)
  - type: worker
    name: saleor-worker
    env: docker
    dockerContext: ./saleor
    dockerfilePath: ./saleor/Dockerfile
    plan: starter
    dockerCommand: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    envVars:
      - fromGroup: saleor-shared-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: saleor-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: saleor-redis
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: redis
          name: saleor-redis
          property: connectionString
      - key: HTTP_IP_FILTER_ENABLED
        value: "False"

  # 4. OTP Auth App (Node microservice with persistent SQLite storage)
  - type: web
    name: saleor-otp-app
    env: docker
    dockerContext: ./apps/auth/otp
    dockerfilePath: ./apps/auth/otp/Dockerfile
    plan: starter
    disk:
      name: otp-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 80
      - key: SALEOR_API_URL
        value: https://santhiyavaathukadai.udayamarketing.in/graphql/

  # 5. Razorpay Payments App (Node microservice with persistent SQLite storage)
  - type: web
    name: saleor-razorpay-app
    env: docker
    dockerContext: ./apps/payments/razorpay
    dockerfilePath: ./apps/payments/razorpay/Dockerfile
    plan: starter
    disk:
      name: razorpay-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 80

databases:
  # 6. PostgreSQL Database
  - name: saleor-db
    databaseName: saleor
    user: saleor
    plan: free

envVarGroups:
  - name: saleor-shared-secrets
    envVars:
      - key: SECRET_KEY
        generateValue: true
