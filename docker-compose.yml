services:
  api:
    build:
      context: ./saleor
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    stdin_open: true
    tty: true
    depends_on:
      - db
      - cache
      - jaeger
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media
    env_file:
      - common.env
      - backend.env
    environment:
      - DASHBOARD_URL=http://localhost:9000/
      - ALLOWED_HOSTS=localhost,127.0.0.1,api,.localhost,.udayamarketing.in

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:3.23
    ports:
      - 9000:80
    restart: unless-stopped
    environment:
      - API_URL=/graphql/

  razorpay-app:
    build:
      context: ./apps/payments/razorpay
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    environment:
      - APP_URL=https://razorpay-app.udayamarketing.in
    volumes:
      - saleor-razorpay-app-db:/app/data

  otp-app:
    build:
      context: ./apps/auth/otp
      dockerfile: Dockerfile
    ports:
      - 8081:8081
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    environment:
      - APP_URL=https://otp-app.udayamarketing.in
    volumes:
      - saleor-otp-app-db:/app/data

  gifts-app:
    build:
      context: ./apps/gifts
      dockerfile: Dockerfile
    ports:
      - 8082:8082
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    environment:
      - DATABASE_URL=postgres://saleor:saleor@db/saleor
      - APP_URL=https://gifts-app.udayamarketing.in
    volumes:
      - saleor-gifts-app-db:/app/data
      - ./saleor/media:/app/media:rw

  products-feed:
    build:
      context: ./apps/products-feed
      dockerfile: Dockerfile
    ports:
      - 8083:3000
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    environment:
      - PORT=3000
      - APP_URL=https://products-feed.udayamarketing.in
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-mock-key}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-mock-secret}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-mock-bucket}
      - SECRET_KEY=${PRODUCTS_FEED_SECRET_KEY:-default_products_feed_secret_key_change_me}
      - REQUEST_SECRET=${PRODUCTS_FEED_REQUEST_SECRET:-default_products_feed_request_secret_change_me}

  db:
    image: library/postgres:15-alpine
    ports:
      - 5432:5432
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-db:/var/lib/postgresql/data
      - ./replica_user.sql:/docker-entrypoint-initdb.d/replica_user.sql:ro,z
    environment:
      - POSTGRES_USER=saleor
      - POSTGRES_PASSWORD=saleor

  cache:
    image: valkey/valkey:8.1-alpine
    ports:
      - 6379:6379
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-cache:/data

  worker:
    build:
      context: ./saleor
      dockerfile: Dockerfile
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    env_file:
      - common.env
      - backend.env
    depends_on:
      - cache
      - mailpit
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media

  jaeger:
    image: jaegertracing/jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - type: tmpfs
        target: /tmp

  mailpit:
    image: axllent/mailpit
    ports:
      - 1025:1025 # smtp server
      - 8025:8025 # web ui. Visit http://localhost:8025/ to check emails
    restart: unless-stopped
    networks:
      - saleor-backend-tier

volumes:
  saleor-db:
    driver: local
  saleor-cache:
    driver: local
  saleor-media:
  saleor-razorpay-app-db:
  saleor-otp-app-db:
  saleor-gifts-app-db:

networks:
  saleor-backend-tier:
    driver: bridge
